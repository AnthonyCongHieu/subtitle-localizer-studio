[project]
name = "subtitle-localizer-studio-t00"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    "pydantic>=2.11.0",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "onnxruntime>=1.23.2",
    "rapidocr-onnxruntime>=1.4.4",
    "deep-translator>=1.11.4",
    "python-multipart>=0.0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
